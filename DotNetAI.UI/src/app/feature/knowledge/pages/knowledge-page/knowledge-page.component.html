<main class="knowledge-app">
  <header>
    <p class="eyebrow">DotNet AI</p>
    <h1>Knowledge workspace</h1>
    <p>Upload documents and search their indexed content.</p>
  </header>

  @if (message) {
    <div class="notice success">{{ message }}</div>
  }
  @if (error) {
    <div class="notice error">{{ error }}</div>
  }

  <app-knowledge-upload
    (uploaded)="onUploaded($event)"
    (failed)="onFailed($event)"
  />
  <app-knowledge-document-list (failed)="onFailed($event)" />
  <app-knowledge-search (failed)="onFailed($event)" />
</main>
