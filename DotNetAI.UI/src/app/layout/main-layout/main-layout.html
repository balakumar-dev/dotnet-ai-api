<mat-sidenav-container>
  <mat-sidenav mode="side" [opened]="menuOpen()">
    <div class="brand">DotNetAI</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/chat" routerLinkActive="active">
        <mat-icon matListItemIcon>chat</mat-icon>
        <span matListItemTitle>AI Chat</span>
      </a>
      <a mat-list-item routerLink="/knowledge" routerLinkActive="active">
        <mat-icon matListItemIcon>library_books</mat-icon>
        <span matListItemTitle>Knowledge Base</span>
      </a>
      <a mat-list-item routerLink="/search" routerLinkActive="active">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Semantic Search</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      <button matIconButton type="button" aria-label="Toggle navigation" (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Enterprise AI Knowledge &amp; Action Platform</span>
    </mat-toolbar>
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
